  <text x="120" y="410" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="600" fill="#0b0b0a">■ Layar LCD Bulat Emosi Dinamis &amp; AI Vision Multimodal</text>
  <text x="120" y="445" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="600" fill="#0b0b0a">■ 36 MCP Superpowers (DevOps, BMKG, EduSmart)</text>

  <!-- Footer Meta in Card -->
  <rect x="120" y="490" width="220" height="42" fill="#0b0b0a"/>
  <text x="230" y="517" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#fff8ec" text-anchor="middle">Pre-Order Unit &amp; Kit →</text>

  <text x="1060" y="517" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#454039" text-anchor="end">produk.irsyadlabs.id</text>
