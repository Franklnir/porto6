  <text x="152" y="122" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#0b0b0a" letter-spacing="1">01 / PHYSICAL AI COMPANION &amp; IOT HUB</text>

  <!-- Big Brand Heading -->
  <text x="120" y="210" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="700" fill="#0b0b0a" letter-spacing="-2">XICHI <tspan fill="#f8ba08">ASISTEN AI</tspan></text>

  <!-- Subheading -->
  <text x="120" y="270" font-family="'DM Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#454039">Asisten AI Fisik Masa Depan di Meja Anda</text>

  <!-- Bullet specifications -->
  <text x="120" y="340" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="600" fill="#0b0b0a">■ ESP32-S3 Dual-Core (240MHz + 8MB PSRAM)</text>
