<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background Warm Cream Canvas with Technical Grid -->
  <rect width="1200" height="630" fill="#f5ecdc"/>
  <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200 M0 320 H1200 M0 384 H1200 M0 448 H1200 M0 512 H1200 M0 576 H1200" stroke="rgba(11,11,10,0.04)" stroke-width="1"/>
  <path d="M64 0 V630 M128 0 V630 M192 0 V630 M256 0 V630 M320 0 V630 M384 0 V630 M448 0 V630 M512 0 V630 M576 0 V630 M640 0 V630 M704 0 V630 M768 0 V630 M832 0 V630 M896 0 V630 M960 0 V630 M1024 0 V630 M1088 0 V630 M1152 0 V630" stroke="rgba(11,11,10,0.04)" stroke-width="1"/>

  <!-- Brutalist Outer Card with Hard Shadow -->
  <rect x="76" y="56" width="1048" height="518" fill="#0b0b0a"/>
  <rect x="68" y="48" width="1048" height="518" fill="#fff8ec" stroke="#0b0b0a" stroke-width="3"/>
  <rect x="68" y="48" width="1048" height="12" fill="#ef4316"/>

  <!-- Technical Chip Tag -->
  <rect x="120" y="100" width="340" height="34" fill="#f5ecdc" stroke="#0b0b0a" stroke-width="1.5"/>
